[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgraphx"
# Keep this in sync with tgraphx/__init__.py::__version__
version = "0.1.0"
description = "Tensor-aware graph neural networks preserving spatial node feature layouts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Arash Sajjadi", email = "arash.sajjadi@usask.ca"},
    {name = "Mark Eramian"},
]
maintainers = [
    {name = "Arash Sajjadi", email = "arash.sajjadi@usask.ca"},
]
keywords = [
    "graph neural networks",
    "GNN",
    "CNN",
    "spatial",
    "PyTorch",
    "computer vision",
    "message passing",
    "tensor-aware",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=1.13",
    "torchvision>=0.14",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=0.10",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/arashsajjadi/TGraphX"
Repository = "https://github.com/arashsajjadi/TGraphX"
Issues = "https://github.com/arashsajjadi/TGraphX/issues"
Paper = "https://arxiv.org/abs/2504.03953"

[tool.setuptools.packages.find]
where = ["."]
include = ["tgraphx*"]
exclude = ["tests*", "examples*", "dist*", "build*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short --strict-markers"
