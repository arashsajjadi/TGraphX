[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgraphx"
# Keep this in sync with tgraphx/__init__.py::__version__
version = "1.3.4"
description = "Tensor-aware graph neural networks preserving spatial node feature layouts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Arash Sajjadi", email = "arash.sajjadi@usask.ca"},
]
maintainers = [
    {name = "Arash Sajjadi", email = "arash.sajjadi@usask.ca"},
]
keywords = [
    "graph neural networks",
    "GNN",
    "CNN",
    "spatial",
    "PyTorch",
    "computer vision",
    "message passing",
    "tensor-aware",
    "dashboard",
    "graph learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=1.13",
    "torchvision>=0.14",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",
    "build>=0.10",
    "twine>=4.0",
    # optional deeper static analysis (not required for tests or normal dev)
    "radon>=5.1",
    "vulture>=2.7",
    "bandit>=1.7",
]
# Hardware-monitoring extras for the dashboard
monitoring = [
    "psutil>=5.9",
    "pynvml>=11.0",
]
# TensorBoard integration (TensorBoardLogger uses torch.utils.tensorboard)
tracking = [
    "tensorboard>=2.11",
]
# MLflow integration (MLflowLogger uses lazy mlflow import)
mlflow = [
    "mlflow>=2.0",
]
# PyG dataset adapters (lazy import; see https://pytorch-geometric.readthedocs.io
# for installation matching your torch / CUDA build).
pyg = [
    "torch-geometric>=2.0",
]
# OGB dataset adapters (lazy import).
ogb = [
    "ogb>=1.3.6",
]
# Image folder dataset uses Pillow lazily; expose it as a small extra.
pillow = [
    "Pillow>=9.0",
]

[project.scripts]
tgraphx-dashboard = "tgraphx.dashboard.app:main"
tgraphx-train = "tgraphx.experiments.cli:train_main"
tgraphx-grid = "tgraphx.experiments.cli:grid_main"
tgraphx-report = "tgraphx.experiments.cli:report_main"
tgraphx-doctor = "tgraphx.__main__:main"
tgraphx-info = "tgraphx.__main__:main"

[project.urls]
Homepage = "https://github.com/arashsajjadi/TGraphX"
Repository = "https://github.com/arashsajjadi/TGraphX"
Documentation = "https://github.com/arashsajjadi/TGraphX/tree/main/docs"
Issues = "https://github.com/arashsajjadi/TGraphX/issues"
Changelog = "https://github.com/arashsajjadi/TGraphX/blob/main/CHANGELOG.md"
Paper = "https://arxiv.org/abs/2504.03953"

[tool.setuptools.packages.find]
where = ["."]
include = ["tgraphx*"]
exclude = ["tests*", "examples*", "dist*", "build*"]

[tool.setuptools.package-data]
"tgraphx.dashboard" = ["static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short --strict-markers"
filterwarnings = [
    # PyTorch upstream: torch.jit.script_method deprecated in favour of torch.compile
    "ignore:.*torch.jit.script_method.*:DeprecationWarning",
]
