# Default config — DEV_EXPERIMENT mode. Uses a small real dataset and at least
# RetinaNet (always available via torchvision) + optionally ultralytics YOLO if
# weights are cached locally or can be downloaded.

run_name: dev_experiment
seed: 42
device: auto
fast_mode: false
mode: DEV_EXPERIMENT

dataset:
  name: voc2007                    # falls back to synthetic_voc_like if not found
  voc_root: data/VOCdevkit         # relative to project root
  num_images: 128
  num_classes: 20
  image_size: [320, 320]
  class_names: null                # null → use VOC's 20 classes

detectors:
  use_real: true
  use_yolo: true
  use_yoloe: false                 # opt-in once weights known available
  use_rtdetr: true
  use_retinanet: true
  yolo_model: yolo11n.pt
  yoloe_model: yoloe-11s-seg.pt
  rtdetr_source: ultralytics
  rtdetr_model: rtdetr-l.pt
  rtdetr_hf_model: PekingU/rtdetr_r50vd_coco_o365
  conf_threshold: 0.25
  iou_threshold: 0.45

graph:
  cluster_iou_threshold: 0.5
  crop_size: 96
  max_proposals_per_image: 128
  include_context_node: true
  include_consensus_nodes: true

model:
  hidden_dim: 64
  crop_channels: 32
  num_message_passing: 3

training:
  epochs: 8
  batch_size: 4
  lr: 1.0e-3
  weight_decay: 1.0e-4
  objectness_weight: 1.0
  class_weight: 0.5
  box_weight: 1.0
  early_stopping_patience: 5

fusion:
  mode: selector
  score_mode: residual
  residual_alpha: 0.1

evaluation:
  iou_match_threshold: 0.5
  ap_iou_thresholds: [0.5, 0.75]
  per_class_ap: true
  report_latency: true
  class_agnostic: true

output:
  run_dir_base: runs
  reports_dir: reports
