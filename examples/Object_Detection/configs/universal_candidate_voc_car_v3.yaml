# V3: Improved training with early stopping, augmentation, AP75 focus
# Same detector set as V2. Uses existing object_graphs.pt from v2 run.
# Point --run-dir at runs/universal_candidate_voc_car_v2 to reuse graphs.
run_name: universal_candidate_voc_car_v2   # reuse v2 graph artifacts
seed: 42
seeds: [0, 1, 2, 3, 4]
device: auto
mode: REAL_EXPERIMENT
experiment_type: object_level_candidate_node_selection

dataset:
  name: voc2007
  voc_root: data/VOCdevkit
  num_images: 9999
  num_classes: 1
  image_size: [320, 320]
  class_filter: [car]
  class_names: [car]
  split_policy: fixed_seed_subset

detectors:
  use_real: true
  use_yolo: true
  use_rtdetr: true
  use_yoloworld: true
  use_retinanet: true
  use_faster_rcnn: true
  use_ssd: false
  use_yoloe: false
  yolo_model: yolo26x.pt
  yolo_fallback: yolo11x.pt
  rtdetr_model: rtdetr-x.pt
  rtdetr_fallback: rtdetr-l.pt
  yoloworld_model: yolov8x-worldv2.pt
  rtdetr_source: ultralytics
  conf_threshold: 0.10
  iou_threshold: 0.50
  class_filter: [car]

graph:
  cluster_iou_threshold: 0.5
  crop_size: 128            # used for stored crops; pointer selector uses 32 internally
  max_proposals_per_image: 80
  include_context_node: false
  include_consensus_nodes: true
  object_level_export: true

model:
  # TGXPointerSelector config
  hidden_dim_ptr: 32        # compact pointer selector
  crop_channels_ptr: 8      # compact crop encoder
  num_attn_layers: 2        # 2 self-attention layers
  # kept for flat_crop_mp ablation compatibility
  hidden_dim: 32
  crop_channels: 8
  num_message_passing: 2
  use_message_passing: true
  use_metadata: true
  feature_mode: tgx_pointer_selector

training:
  epochs: 60                # more epochs; early stopping will terminate when needed
  lr: 3.0e-4
  weight_decay: 5.0e-4     # stronger than before
  lambda_selection: 1.0
  lambda_tp75: 2.0          # AP75 focus
  lambda_tp50: 0.5          # downweight AP50 head
  lambda_iou: 0.5
  lambda_rank: 0.5
  label_smooth: 0.05
  utility_mode: ap75        # AP75-focused best node selection
  early_stop_patience: 15
  warmup_epochs: 5

evaluation:
  iou_match_threshold: 0.5
  ap_iou_thresholds: [0.5, 0.75]
  class_agnostic: true

output:
  run_dir_base: runs/v2_candidate   # where checkpoints go (reuse v2 data dir)
  reports_dir: reports
