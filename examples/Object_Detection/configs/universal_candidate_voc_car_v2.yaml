# Universal Candidate Node Selection — v2 with yolo26x, rtdetr-x, yolov8x-worldv2
#
# DETECTOR SET (required checkpoints):
#   yolo26x.pt        (Ultralytics YOLO26X — highest-capacity YOLO available)
#   rtdetr-x.pt       (Ultralytics RT-DETR X — largest RT-DETR variant)
#   yolov8x-worldv2.pt (YOLO-World — detection-only open-vocab, largest variant)
#   torchvision RetinaNet  (anchor-based, COCO weights)
#   torchvision Faster R-CNN (two-stage, optional)
#
# Hard rule: if yolo26x fails → use yolo11x and mark as FALLBACK in audit.
#            if rtdetr-x fails → use rtdetr-l and mark as FALLBACK in audit.
#
run_name: universal_candidate_voc_car_v2
seed: 42
seeds: [0, 1, 2, 3, 4]
device: auto
mode: REAL_EXPERIMENT
experiment_type: object_level_candidate_node_selection

dataset:
  name: voc2007
  voc_root: data/VOCdevkit
  num_images: 9999         # use ALL available car images (761 total)
  num_classes: 1
  image_size: [320, 320]
  class_filter: [car]
  class_names: [car]
  split_policy: fixed_seed_subset

detectors:
  use_real: true
  use_yolo: true            # → yolo26x.pt (primary)
  use_rtdetr: true          # → rtdetr-x.pt (primary)
  use_yoloworld: true       # → yolov8x-worldv2.pt (detection-only)
  use_retinanet: true       # → torchvision retinanet_resnet50_fpn_v2
  use_faster_rcnn: true     # → torchvision fasterrcnn_resnet50_fpn_v2
  use_ssd: false            # excluded: low quality, distorts results
  use_yoloe: false          # legacy flag, use_yoloworld supersedes this
  # Primary checkpoints
  yolo_model: yolo26x.pt
  yolo_fallback: yolo11x.pt
  rtdetr_model: rtdetr-x.pt
  rtdetr_fallback: rtdetr-l.pt
  yoloworld_model: yolov8x-worldv2.pt
  rtdetr_source: ultralytics
  conf_threshold: 0.10      # lower threshold to get more proposals for fusion
  iou_threshold: 0.50
  class_filter: [car]

graph:
  cluster_iou_threshold: 0.5
  crop_size: 128
  max_proposals_per_image: 80   # increased for more detectors
  include_context_node: false
  include_consensus_nodes: true
  object_level_export: true

model:
  hidden_dim: 64
  crop_channels: 16
  num_message_passing: 2
  use_message_passing: true
  use_metadata: true
  feature_mode: crop_metadata_mp

training:
  epochs: 40               # more epochs with larger dataset
  lr: 3.0e-4
  weight_decay: 2.0e-4     # stronger regularization
  lambda_selection: 1.0
  lambda_tp50: 1.0
  lambda_tp75: 2.0
  lambda_iou: 0.5
  lambda_rank: 0.5
  utility_mode: deployable

evaluation:
  iou_match_threshold: 0.5
  ap_iou_thresholds: [0.5, 0.75]
  class_agnostic: true

output:
  run_dir_base: runs/v2_candidate
  reports_dir: reports
