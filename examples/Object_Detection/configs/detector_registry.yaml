# Detector registry (v1.4.1+). This file documents the model identifiers the
# pipeline will try, in order, for each detector family. The first that loads
# successfully is used; the others are recorded as unavailable.

yolo:
  family: "modern_yolo"
  source: "ultralytics"
  candidates:
    - yolo11n.pt
    - yolo11s.pt
    - yolo11m.pt
    - yolov10n.pt
    - yolov8n.pt
  notes: |
    "YOLO26x" is not a verified Ultralytics model identifier as of this writing.
    The pipeline uses the most modern YOLO model that loads cleanly from the
    installed Ultralytics version. Result tables record the actual identifier.

yoloe:
  family: "open_vocabulary_yolo"
  source: "ultralytics"
  candidates:
    - yoloe-11s-seg.pt
    - yoloe-11m-seg.pt
    - yolov8s-world.pt           # YOLO-World (open-vocab) — Ultralytics
    - yolov8m-world.pt
  notes: |
    Ultralytics ships open-vocabulary "YOLO-World" and (in newer versions)
    "YOLOE". When neither loads, this detector is marked unavailable rather
    than silently replaced. Closed-class datasets use text prompts mapped to
    dataset class names.

rt_detr:
  family: "transformer_detector"
  candidates:
    - source: ultralytics
      model: rtdetr-l.pt
    - source: ultralytics
      model: rtdetr-x.pt
    - source: huggingface
      model: PekingU/rtdetr_r50vd_coco_o365
  notes: |
    Two backends are attempted: Ultralytics' RT-DETR and HuggingFace
    transformers' RTDetrForObjectDetection. Whichever loads first is used.

retinanet:
  family: "anchor_based_cnn"
  source: torchvision
  candidates:
    - retinanet_resnet50_fpn_v2
    - retinanet_resnet50_fpn
  notes: |
    Always available via torchvision pretrained weights. Used as the
    last-resort detector if all others fail.
