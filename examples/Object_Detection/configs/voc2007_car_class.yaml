run_name: voc2007_car_class
seed: 42
device: auto
fast_mode: false
mode: OLD_COMPATIBLE

dataset:
  name: voc2007
  voc_root: data/VOCdevkit
  num_images: 1000  # all car images
  num_classes: 1
  class_names: [car]
  image_size: [320, 320]
  class_filter: [car]

detectors:
  use_real: true
  use_yolo: true
  use_yoloe: false
  use_rtdetr: false
  use_retinanet: true
  yolo_model: yolo11n.pt
  conf_threshold: 0.15
  iou_threshold: 0.5

graph:
  cluster_iou_threshold: 0.5
  crop_size: 96
  max_proposals_per_image: 32
  include_context_node: false
  include_consensus_nodes: true

fusion:
  mode: selector
  score_mode: logits
  residual_alpha: 0.0

model:
  hidden_dim: 48
  crop_channels: 16
  num_message_passing: 2

training:
  epochs: 50
  lr: 5.0e-4
  weight_decay: 1.0e-4
  objectness_weight: 1.0
  class_weight: 0.5
  box_weight: 0.0

evaluation:
  iou_match_threshold: 0.5
  ap_iou_thresholds: [0.5, 0.75]
  class_agnostic: false

output:
  run_dir_base: runs
