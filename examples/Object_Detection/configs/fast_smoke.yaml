# FAST_SMOKE configuration for the TGraphX object-detection graph-fusion
# experiment. Designed to run end-to-end on CPU in minutes with no external
# downloads. Uses synthetic detector outputs + RetinaNet (if available) only.

run_name: fast_smoke
seed: 42
device: auto                       # auto / cpu / cuda
fast_mode: true
mode: FAST_SMOKE

dataset:
  name: synthetic_voc_like         # synthetic_voc_like | voc2007 | custom_folder | coco_mini
  num_images: 16                   # tiny — for FAST_SMOKE
  num_classes: 5
  image_size: [256, 256]
  class_names: [person, car, dog, cat, bicycle]

detectors:
  # FAST_SMOKE uses synthetic detector outputs by default so we can run with no
  # network. Setting `use_real: true` triggers real detector adapters with
  # graceful fallback to synthetic if a model is unavailable.
  use_real: false
  use_yolo:   true                 # ultralytics YOLO if available
  use_yoloe:  true                 # open-vocab YOLO if available
  use_rtdetr: true                 # RT-DETR if available
  use_retinanet: true              # torchvision RetinaNet if available
  yolo_model: yolo11n.pt           # small + fast; not yolo11x
  yoloe_model: yoloe-11s-seg.pt    # if available in ultralytics
  rtdetr_source: ultralytics       # ultralytics | huggingface
  rtdetr_model: rtdetr-l.pt        # ultralytics
  rtdetr_hf_model: PekingU/rtdetr_r50vd_coco_o365
  conf_threshold: 0.25
  iou_threshold: 0.45

graph:
  cluster_iou_threshold: 0.5
  crop_size: 64                    # tensor crop spatial size for graph nodes
  max_proposals_per_image: 64
  include_context_node: true
  include_consensus_nodes: true

model:
  hidden_dim: 32
  crop_channels: 16
  num_message_passing: 2

training:
  epochs: 2
  batch_size: 2
  lr: 1.0e-3
  weight_decay: 1.0e-4
  objectness_weight: 1.0
  class_weight: 0.5
  box_weight: 1.0
  early_stopping_patience: 3

evaluation:
  iou_match_threshold: 0.5
  ap_iou_thresholds: [0.5, 0.75]
  per_class_ap: true
  report_latency: true

output:
  run_dir_base: runs
  reports_dir: reports
