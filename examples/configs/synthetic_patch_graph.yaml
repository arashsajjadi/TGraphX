seed: 0
run_name: synthetic_patch_graph
dataset:
  name: synthetic:patch_graph
  kwargs:
    num_graphs: 16
    image_size: 16
    patch_size: 4
    seed: 0
model:
  task: graph_classification
  layer: conv
  in_shape: [1, 4, 4]
  hidden_shape: [8, 4, 4]
  num_layers: 2
  num_classes: 6
  pooling: mean
training:
  epochs: 5
  lr: 0.005
  optimizer: adam
  device: cpu
  loss: cross_entropy
callbacks:
  - {name: csv_logger}
  - {name: lr_logger}
  - name: early_stopping
    kwargs: {monitor: train_loss, patience: 3, mode: min}
  - name: model_checkpoint
    kwargs: {monitor: train_loss, mode: min}
