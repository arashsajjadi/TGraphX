[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backgammon-rlx"
version = "0.1.0"
description = "Research-grade self-play reinforcement learning for backgammon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BackgammonX Authors" }]

dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov", "hypothesis>=6.80"]
tb  = ["tensorboard>=2.14"]
nb  = ["numba>=0.58"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
