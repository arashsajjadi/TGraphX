# Money-game training with doubling cube (experimental)
device: cuda
seed: 42
game_mode: money_game
mixed_precision: true
compile_model: false
rollout_mode: single
state_dim: 256
act_dim: 256
n_point_residual: 4
n_action_residual: 3
rollout_games_per_update: 64
total_games: 1_000_000
gamma: 0.999
gae_lambda: 0.95
clip_range: 0.2
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 1.0
update_epochs: 4
minibatch_size: 512
learning_rate: 0.0003
weight_decay: 0.00001
log_interval: 10
checkpoint_interval: 50000
runs_dir: runs
tensorboard: false
# Note: cube actions not yet integrated into PPO rollout (checker-play only for now)
